<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>舆情风险监测地图</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0E14;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 12px;
    overflow: hidden; }
  #map { width: 100%; height: 100%; }
  /* 环境氛围：边缘暗角 + 顶部标题辉光 */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,255,156,0.05) 0%, transparent 55%),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #title { position: absolute; top: 10px; left: 14px; pointer-events: none;
    font-size: 15px; font-weight: bold; letter-spacing: 4px; color: #00FF9C;
    text-shadow: 0 0 8px rgba(0,255,156,0.8); }
  #crumb { position: absolute; top: 34px; left: 14px; pointer-events: none;
    font-size: 12px; color: #8B98A9; letter-spacing: 1px; }
  /* 返回按钮：荧光绿描边，hover 提亮，active 反转（与页面按钮三态一致） */
  #back { position: absolute; top: 10px; right: 14px; display: none;
    background: #0F241B; color: #00FF9C; border: 1px solid #00FF9C;
    border-radius: 4px; padding: 4px 14px; cursor: pointer; font-size: 12px;
    font-family: inherit; letter-spacing: 2px;
    box-shadow: 0 0 6px rgba(0,255,156,0.35); transition: all .12s; }
  #back:hover { background: #1B2330; box-shadow: 0 0 12px rgba(0,255,156,0.6); }
  #back:active { background: #00FF9C; color: #0A0E14; }
  /* 图例 */
  #legend { position: absolute; bottom: 12px; right: 14px;
    background: rgba(13,19,28,0.88); border: 1px solid #2A3441; border-radius: 4px;
    padding: 6px 10px; color: #E6EDF3; line-height: 1.9;
    box-shadow: 0 0 8px rgba(0,0,0,0.5); }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
    box-shadow: 0 0 5px currentColor; }
  /* 光点详情弹层：霓虹情报卡 */
  #popup { position: absolute; display: none; width: 320px; max-height: 70%;
    background: rgba(13,19,28,0.96); border: 1px solid #00FF9C; border-radius: 6px;
    box-shadow: 0 0 18px rgba(0,255,156,0.35), inset 0 0 12px rgba(0,255,156,0.06);
    color: #E6EDF3; z-index: 20; overflow: hidden;
    animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); }
                      to { opacity: 1; transform: none; } }
  #popup .hd { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: rgba(0,255,156,0.08); cursor: move;
    border-bottom: 1px solid rgba(0,255,156,0.3); }
  #popup .hd b { color: #00FF9C; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(0,255,156,0.6); }
  #popup .close { cursor: pointer; color: #8B98A9; padding: 0 4px; font-size: 14px; }
  #popup .close:hover { color: #FF4D4D; }
  #popup .bd { padding: 8px 12px; overflow-y: auto; max-height: 52vh; }
  #popup .bd::-webkit-scrollbar { width: 6px; }
  #popup .bd::-webkit-scrollbar-thumb { background: #2E3A48; border-radius: 3px; }
  #popup .stat { color: #8B98A9; margin-bottom: 8px; }
  #popup .stat em { font-style: normal; color: #00FF9C; font-weight: bold; }
  .ev { border: 1px solid #2A3441; border-left: 3px solid #4DA3FF; border-radius: 3px;
    padding: 6px 8px; margin-bottom: 6px; background: rgba(22,28,38,0.7); }
  .ev.high { border-left-color: #FF4D4D; }
  .ev.medium { border-left-color: #FFA033; }
  .ev.low { border-left-color: #FFD84D; }
  .ev .t { color: #E6EDF3; font-weight: bold; line-height: 1.4; }
  .ev .m { color: #8B98A9; margin-top: 2px; font-size: 11px; }
  .ev .s { color: #AAB6C4; margin-top: 4px; line-height: 1.5; }
  .ev .v { color: #00FF9C; margin-top: 4px; line-height: 1.5;
    border-top: 1px dashed #2A3441; padding-top: 4px; }
  .sev-tag { display: inline-block; padding: 0 6px; border-radius: 2px;
    font-size: 10px; margin-left: 6px; vertical-align: middle; }
  .sev-tag.high { background: rgba(255,77,77,0.15); color: #FF4D4D;
    border: 1px solid #FF4D4D; }
  .sev-tag.medium { background: rgba(255,160,51,0.15); color: #FFA033;
    border: 1px solid #FFA033; }
  .sev-tag.low { background: rgba(255,216,77,0.12); color: #FFD84D;
    border: 1px solid #FFD84D; }
  #loading { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; color: #00FF9C; letter-spacing: 4px; z-index: 30;
    background: rgba(10,14,20,0.6); text-shadow: 0 0 10px rgba(0,255,156,0.8); }
</style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>
<div id="title">舆情风险监测</div>
<div id="crumb">中国 · 全国</div>
<button id="back">⌫ 返回全国</button>
<div id="legend"></div>
<div id="popup">
  <div class="hd" id="popup_hd"><b id="popup_title"></b><span class="close" id="popup_close">✕</span></div>
  <div class="bd" id="popup_body"></div>
</div>
<div id="loading">加载市级边界…</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="echarts.min.js"></script>
<script>
var chart = null;
var geoReady = false;
var pending = null;          // [spotsJson, mode]
var curSpots = [];           // 当前渲染的光点原始数据
var curMode = "severity";
var curLevel = "china";      // china | province
var curProvName = "";
var window_bridge = null;

var SEV_COLORS = { high: "#FF4D4D", medium: "#FFA033", low: "#FFD84D", none: "#00FF9C" };
var SEV_LABELS = { high: "高危", medium: "中危", low: "关注", none: "平稳" };
var CAT_COLORS = { enforcement: "#FF4D4D", lawsuit: "#FFD84D", biz_change: "#FFA033", news: "#4DA3FF", social: "#C77DFF" };
var CAT_ORDER = ["enforcement", "lawsuit", "biz_change", "news", "social"];
var CAT_LABELS = { news: "舆情新闻", biz_change: "工商变更", lawsuit: "涉诉", enforcement: "被执行/查封", social: "社媒" };
var NEON = "#00FF9C";

// 地图样式：黑底 + 荧光绿边界 + 辉光
function geoStyle() {
  return {
    map: curLevel === "china" ? "china" : "prov",
    roam: true, zoom: curLevel === "china" ? 1.12 : 1.0,
    scaleLimit: { min: 0.6, max: 12 },
    itemStyle: {
      areaColor: "#0D1420", borderColor: NEON, borderWidth: 1.2,
      shadowColor: "rgba(0,255,156,0.45)", shadowBlur: 10,
      shadowOffsetY: 2
    },
    emphasis: {
      label: { show: true, color: "#E6EDF3", fontSize: 12, fontFamily: "Microsoft YaHei" },
      itemStyle: { areaColor: "#122B1F", borderColor: NEON, borderWidth: 2,
        shadowColor: "rgba(0,255,156,0.9)", shadowBlur: 18 }
    },
    select: { disabled: true }
  };
}

function normProv(p) {
  if (!p) return "";
  var s = String(p).replace(/\s/g, "");
  var suffixes = ["维吾尔自治区", "壮族自治区", "回族自治区", "自治区", "特别行政区", "省", "市"];
  for (var i = 0; i < suffixes.length; i++) {
    if (s.length > suffixes[i].length && s.slice(-suffixes[i].length) === suffixes[i]) {
      return s.slice(0, s.length - suffixes[i].length);
    }
  }
  return s;
}

new QWebChannel(qt.webChannelTransport, function (channel) {
  window_bridge = channel.objects.bridge;
  flushPending();
});

function flushPending() {
  if (pending && chart && geoReady && window_bridge) {
    var s = pending[0], m = pending[1];
    pending = null;
    applySpots(s, m);
  }
}

// 省名 -> adcode（从 china.json 提取）
var provAdcode = {};

// 加载本地 GeoJSON 并注册地图（全部 file:// 本地资源，无网络请求）
var xhr = new XMLHttpRequest();
xhr.open("GET", "china.json", true);
xhr.onload = function () {
  try {
    var geo = JSON.parse(xhr.responseText);
    var centers = {};
    for (var i = 0; i < geo.features.length; i++) {
      var f = geo.features[i];
      var nm = normProv(f.properties && f.properties.name);
      var c = (f.properties && (f.properties.center || f.properties.centroid)) || null;
      if (nm && c) centers[nm] = c;
      if (f.properties && f.properties.name && f.properties.adcode) {
        provAdcode[f.properties.name] = String(f.properties.adcode);
      }
    }
    echarts.registerMap("china", geo);
    window.__centers = centers;
    chart = echarts.init(document.getElementById("map"), null, { renderer: "canvas" });
    chart.setOption({
      backgroundColor: "transparent",
      tooltip: { trigger: "item", backgroundColor: "rgba(13,19,28,0.95)",
        borderColor: NEON, borderWidth: 1,
        textStyle: { color: "#E6EDF3", fontSize: 12, fontFamily: "Microsoft YaHei" },
        extraCssText: "box-shadow:0 0 12px rgba(0,255,156,0.4);border-radius:4px;" },
      geo: geoStyle()
    });
    chart.on("click", function (params) {
      if (params.componentType === "series") {
        onSpotClicked(params.data);
      } else if (params.componentType === "geo") {
        // 点击省份区域：全国层级下钻到省级市级视图
        if (curLevel === "china" && params.name) drillTo(params.name);
      }
    });
    geoReady = true;
    flushPending();
  } catch (e) {
    document.getElementById("map").innerText = "地图数据解析失败：" + e;
  }
};
xhr.onerror = function () {
  document.getElementById("map").innerText = "地图数据加载失败（china.json 缺失）";
};
xhr.send();

window.onresize = function () { if (chart) chart.resize(); };

// ================= 下钻 =================
function drillTo(provName) {
  if (curLevel !== "china") return;
  var adcode = provAdcode[provName];
  if (!adcode) return;
  document.getElementById("loading").style.display = "flex";
  var x2 = new XMLHttpRequest();
  x2.open("GET", "geo/provinces/" + adcode + "_full.json", true);
  x2.onload = function () {
    document.getElementById("loading").style.display = "none";
    try {
      var g = JSON.parse(x2.responseText);
      if (!g.features || !g.features.length) throw new Error("empty");
      echarts.registerMap("prov", g);
      curLevel = "province";
      curProvName = provName;
      chart.setOption({ geo: geoStyle() });
      document.getElementById("crumb").innerText = "中国 · " + provName;
      document.getElementById("back").style.display = "block";
      renderCurSpots();  // 光点按经纬度自动适配到省图坐标系
    } catch (e) {
      // 无市级数据（如台湾等）：不进入下钻
      document.getElementById("crumb").innerText = "中国 · " + provName + "（无市级精细边界）";
    }
  };
  x2.onerror = function () {
    document.getElementById("loading").style.display = "none";
  };
  x2.send();
}

function backToChina() {
  curLevel = "china";
  curProvName = "";
  hidePopup();
  chart.setOption({ geo: geoStyle() });
  document.getElementById("crumb").innerText = "中国 · 全国";
  document.getElementById("back").style.display = "none";
  renderCurSpots();
}

document.getElementById("back").onclick = backToChina;
// 双击空白处也可返回
document.getElementById("map").ondblclick = function () {
  if (curLevel === "province") backToChina();
};

// ================= 光点渲染 =================
// Qt 侧入口：renderSpots(JSON字符串, "severity"|"category")
function renderSpots(spotsJson, mode) {
  if (chart && geoReady) applySpots(spotsJson, mode);
  else pending = [spotsJson, mode];
}

function spotColor(sp, mode) {
  if (mode === "category") {
    for (var i = 0; i < CAT_ORDER.length; i++) {
      if (sp.categories && sp.categories.indexOf(CAT_ORDER[i]) >= 0) return CAT_COLORS[CAT_ORDER[i]];
    }
    return "#4DA3FF";
  }
  return SEV_COLORS[sp.severity] || SEV_COLORS.none;
}

function applySpots(spotsJson, mode) {
  var spots;
  try { spots = JSON.parse(spotsJson); } catch (e) { spots = []; }
  curSpots = spots;
  curMode = mode || "severity";
  renderCurSpots();
}

function renderCurSpots() {
  var centers = window.__centers || {};
  var data = [];
  var used = {};  // 同城市防重叠：确定性偏移
  // 省级视图只渲染本省光点（其它省的点不在该坐标系内，避免错位残留）
  var curNorm = normProv(curProvName);
  for (var i = 0; i < curSpots.length; i++) {
    var sp = curSpots[i];
    if (curLevel === "province" && normProv(sp.province) !== curNorm) continue;
    var c = null;
    if (sp.lng != null && sp.lat != null) {
      c = [sp.lng, sp.lat];                       // Python 端已解析好的城市坐标
    } else {
      c = centers[normProv(sp.province)] || [104.0, 35.0];  // 回退省中心
    }
    var key = c[0].toFixed(1) + "," + c[1].toFixed(1);
    var k = (used[key] || 0) % 7, ring = Math.floor((used[key] || 0) / 7) + 1;
    used[key] = (used[key] || 0) + 1;
    var ang = (k / 7) * Math.PI * 2;
    var dx = Math.cos(ang) * 0.08 * ring, dy = Math.sin(ang) * 0.06 * ring;
    var cats = sp.categories || [];
    var catTxt = cats.map(function (x) { return CAT_LABELS[x] || x; }).join("、") || "暂无";
    data.push({
      name: sp.name,
      value: [c[0] + dx, c[1] + dy],
      count: sp.event_count || 0,
      sev: sp.severity || "none",
      catTxt: catTxt,
      prov: sp.province || "",
      city: sp.city || "",
      idx: i,
      itemStyle: {
        color: spotColor(sp, curMode),
        shadowColor: spotColor(sp, curMode),
        shadowBlur: 12
      }
    });
  }
  chart.setOption({
    series: [{
      type: "effectScatter",
      coordinateSystem: "geo",
      data: data,
      symbolSize: function (val, params) {
        return 10 + Math.min(24, Math.sqrt(params.data.count || 0) * 4.5);
      },
      rippleEffect: { brushType: "stroke", scale: 3.2, period: 4, number: 2 },
      showEffectOn: "render",
      label: { show: false },
      emphasis: { scale: 1.5 },
      zlevel: 2
    }]
  });
  renderLegend(curMode);
}

// ================= 光点点击 -> 详情弹层 =================
function onSpotClicked(d) {
  if (window_bridge) window_bridge.onSpotClick(d.name);   // 联动右侧事件流过滤
  var sp = curSpots[d.idx] || {};
  showPopup(sp);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showPopup(sp) {
  var pop = document.getElementById("popup");
  document.getElementById("popup_title").innerText = sp.name || "";
  var sev = sp.severity || "none";
  var cats = (sp.categories || []).map(function (x) { return CAT_LABELS[x] || x; }).join("、") || "暂无";
  var loc = [sp.province || "", sp.city || ""].filter(Boolean).join(" / ") || "位置未知";
  var html = '<div class="stat">位置：<em>' + esc(loc) + "</em>　事件：<em>" +
    (sp.event_count || 0) + "</em> 条　风险：" +
    '<em style="color:' + SEV_COLORS[sev] + '">' + SEV_LABELS[sev] + "</em><br>信息域：" + esc(cats) + "</div>";
  var evs = sp.events || [];
  if (!evs.length) {
    html += '<div class="stat">暂无舆情事件记录</div>';
  }
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    var s = e.severity || "low";
    html += '<div class="ev ' + s + '">' +
      '<div class="t">' + esc(e.title) +
      '<span class="sev-tag ' + s + '">' + SEV_LABELS[s] + "</span></div>" +
      '<div class="m">' + esc(CAT_LABELS[e.category] || e.category || "") +
      " · " + esc(e.source || "") + " · " + esc(e.occurred_at || "") + "</div>" +
      (e.summary ? '<div class="s">' + esc(e.summary) + "</div>" : "") +
      (e.ai_verdict ? '<div class="v">AI研判：' + esc(e.ai_verdict) + "</div>" : "") +
      "</div>";
  }
  document.getElementById("popup_body").innerHTML = html;
  pop.style.display = "block";
  // 定位：光点附近，防溢出
  var px = (window.__lastXY && window.__lastXY[0]) || window.innerWidth * 0.62;
  var py = (window.__lastXY && window.__lastXY[1]) || 80;
  var w = 320, h = Math.min(window.innerHeight * 0.7, 460);
  if (px + w + 20 > window.innerWidth) px = px - w - 30;
  if (px < 10) px = 10;
  if (py + h + 20 > window.innerHeight) py = Math.max(10, window.innerHeight - h - 20);
  pop.style.left = px + "px";
  pop.style.top = py + "px";
}

function hidePopup() {
  document.getElementById("popup").style.display = "none";
}

document.getElementById("popup_close").onclick = hidePopup;

// 记录鼠标位置（弹层就近弹出）
document.getElementById("map").addEventListener("mousemove", function (ev) {
  window.__lastXY = [ev.clientX, ev.clientY];
});

// 弹层拖动
(function () {
  var pop = document.getElementById("popup"), hd = document.getElementById("popup_hd");
  var sx = 0, sy = 0, ox = 0, oy = 0, drag = false;
  hd.addEventListener("mousedown", function (e) {
    drag = true; sx = e.clientX; sy = e.clientY;
    ox = pop.offsetLeft; oy = pop.offsetTop;
    e.preventDefault();
  });
  document.addEventListener("mousemove", function (e) {
    if (!drag) return;
    pop.style.left = (ox + e.clientX - sx) + "px";
    pop.style.top = (oy + e.clientY - sy) + "px";
  });
  document.addEventListener("mouseup", function () { drag = false; });
})();

// ================= 图例 =================
function renderLegend(mode) {
  var html = "";
  if (mode === "category") {
    for (var i = 0; i < CAT_ORDER.length; i++) {
      var k = CAT_ORDER[i];
      html += '<div><span class="dot" style="color:' + CAT_COLORS[k] + ';background:' + CAT_COLORS[k] + '"></span>' + CAT_LABELS[k] + "</div>";
    }
  } else {
    var order = ["high", "medium", "low", "none"];
    for (var j = 0; j < order.length; j++) {
      var s = order[j];
      html += '<div><span class="dot" style="color:' + SEV_COLORS[s] + ';background:' + SEV_COLORS[s] + '"></span>' + SEV_LABELS[s] + "</div>";
    }
  }
  document.getElementById("legend").innerHTML = html;
}
</script>
</body>
</html>
