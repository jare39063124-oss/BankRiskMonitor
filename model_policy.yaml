# 模型策略：仅允许免费模型（cost == 0），禁止 openrouter/auto 等元路由
policy:
  require_cost_zero: true
  banned_models:
    - openrouter/auto
    - openrouter/*

# OpenRouter 免费模型 fallback 列表（按序尝试）
# 2026-10 实测：原列表 5 个模型全部 404（已下线/仅付费版），已整体替换。
# 现列表按「实测可返回中文」排序，前两个已逐个验证通过：
#   minimax/minimax-m3.1-flash:free      —— 中文表达自然，贷后场景可用
#   xingchen-agi/xing4.0-29b-a4b:free    —— 中文表达自然，问题针对性强
# 其余为备选（免费模型每日额度受限，可能触发 429）。
# 注意：免费模型有「每日请求额度」，额度耗尽时返回 429；此时应等待额度恢复，
#      程序会自动降级为规则模板（不阻断业务）。
fallback_models:
  - id: minimax/minimax-m3.1-flash:free
    cost: 0
  - id: xingchen-agi/xing4.0-29b-a4b:free
    cost: 0
  - id: google/gemma-4-31b-it:free
    cost: 0
  - id: nvidia/nemotron-3-super-120b-a12b:free
    cost: 0
  - id: poolside/laguna-s-2.1:free
    cost: 0

request:
  timeout_seconds: 60
  max_retries: 2
  backoff_base_seconds: 2
  failure_threshold: 3   # 连续失败次数达到阈值后进入降级模式
