# BankRiskMonitor 全局配置（声明式数据源登记：可新增/启停/排序，无需改代码）
# 数据源可用性分级（ARCH-v2-increment §8.8）：tier=1 确定可用（无需 Key 官方源，默认启用）
#   tier=2 条件可用（需 Key/Cookie/限次/付费，默认关闭仅留配置位）
#   tier=3 尽力而为（反爬站点，默认启用、允许失败）
app:
  name: BankRiskMonitor
  refresh_interval_minutes: 30   # 定时刷新周期（0=关闭自动刷新）
  lookback_years: 3              # 舆情追溯窗口（年）：入库时过滤掉早于该时间的事件（无日期的保留）
  relevance_filter: strict       # 相关性过滤：strict=只保留标题/摘要含主体名或核心词的事件；off=不过滤
  proxy: ""                      # HTTP 代理，如 http://127.0.0.1:7890；留空不使用

penetration:
  enabled: true
  up_levels: 2      # 向上股东穿透层数（1-2）
  down_levels: 2    # 向下对外投资穿透层数（1-2）

# 贷后必备信息域：扫描启动时若某域没有「可靠」数据源（只有反爬站点这类尽力而为源，
# 或一个都没启用），界面会**明确提示缺什么、怎么补**，绝不静默。删掉本条即用内置默认。
required_coverage:
  - category: lawsuit
    label: 涉诉
    hint: "裁判文书网反爬严格、页面采集不稳定。建议用工商连接器（企查查/天眼查/启信慧眼/水滴信用）代查后，按 docs/CONNECTOR-DATA-REQUEST.md 生成标准格式文件并导入。"
  - category: enforcement
    label: 被执行/失信
    hint: "执行信息公开网有验证码。建议同上：连接器代查 → 标准格式文件 → 导入。"

# 数据源声明式登记：category -> 有序 Provider 链（排在前面的优先）
# enabled: true/false 控制启停；params 中的 key 留空表示该源未启用（自动跳过）
# 本轮策略（用户已确认）：只用免费/官方公开源；付费/需 Key 源一律 enabled:false 仅留配置位。
sources:
  news:
    - name: baidu_news
      enabled: true
      tier: 3            # 尽力而为：搜索结果页采集，可能被反爬
      class: providers.news_baidu.BaiduNewsProvider
      params: {}
    - name: sogou_news
      enabled: false
      tier: 3
      class: providers.news_sogou.SogouNewsProvider
      params: {}
    - name: rss
      enabled: true
      tier: 3
      class: providers.news_rss.RssProvider
      params:
        feeds:
          - https://rsshub.app/pengpai/channels/25
    - name: istero_pengpai
      enabled: false     # 需 Key（token 留空）：按"需 Key 源默认关闭"口径保持一致性
      tier: 2            # 条件可用：需 token
      requires_key: true
      class: providers.news_istero.IsteroNewsProvider
      params:
        base_url: https://api.istero.com/service/pengpaixinwen/reshoubang
        token: ""
    - name: newsapi
      enabled: false
      tier: 2            # 条件可用：需 Key（付费/限次）
      requires_key: true
      class: providers.newsapi_org.NewsApiProvider
      params:
        api_key: ""
  biz_change:
    - name: aiqicha
      enabled: true
      tier: 2            # 条件可用：可选 Cookie（未登录配额有限），免费
      class: providers.biz_aiqicha.AiqichaProvider
      params:
        # 可选：浏览器登录爱企查后 F12 复制 Cookie 填入，可解除未登录每日配额限制
        cookie: ""
    - name: gsxt
      enabled: true      # 本轮启用（R2）：经营异常/行政处罚/变更记录
      tier: 3            # 尽力而为：政务站点强反爬，允许失败
                         # 实测 2026-10：首页 HTTP 521（政务 WAF），程序无法通过
      class: providers.biz_gsxt.GsxtProvider
      params: {}
    - name: apizero
      enabled: true      # 兜底：免费限次（无需 Key 匿名可用 5 次/日）
      tier: 2
      class: providers.biz_apizero.ApiZeroProvider
      params:
        # ApiZero（极数本源）企业工商查询：无需 Key 匿名即可用（5 次/日、1 QPS）
        # 填 api_key 后提升为 10 次/日（header Bearer + params key 双通道）
        # 实测 2026-10：匿名额度用尽后返回 code=4015「需要 API Key」，填 Key 即恢复
        api_key: ""
    # Tavily 搜索（tavily.com，免费额度）—— 工商信息的**跨域补充源**：
    #   实测结论（两个主体 × 多组 query）：
    #     ① query 只写企业全名（不加「工商变更/被执行」等关键词）精度最高；
    #        加关键词后 Tavily 语义排序会偏向关键词页面，命中该企业的结果反而降到 0。
    #     ② include_domains 限定到工商平台（qcc/天眼查/爱企查/公示网）可稳定拿到
    #        该企业的档案页；限定到法院域名则拿不到结果（索引覆盖有限）。
    #   因此本条目只登记在 biz_change，涉诉/被执行交给 rmfygg（tier 1、免 Key、无限次）。
    #   api_key 走 ${TAVILY_API_KEY} 间接引用（真实密钥放 .env，config.yaml 不入库）；
    #   .env 未配时该源自动跳过，不影响其它源。
    - name: tavily
      enabled: true
      tier: 2            # 条件可用：需 Key（免费额度，advanced 深度约 2 积分/次）
      requires_key: true
      class: providers.tavily_search.TavilyProvider
      params:
        api_key: "${TAVILY_API_KEY}"
        event_category: biz_change
        query: '"{name}"'
        search_depth: advanced
        max_results: 5
        include_domains:
          - qcc.com
          - tianyancha.com
          - aiqicha.baidu.com
          - gsxt.gov.cn
          - creditchina.gov.cn
    - name: tianapi
      enabled: false     # 条件可用（付费/赠豆）：默认关闭，仅留 Key 位
      tier: 2
      paid: true
      requires_key: true
      supports_mcp: true
      class: providers.biz_commercial.CommercialApiProvider
      params:
        # 天聚数行 tianapi.com 工商查询（接口 272）：800 天豆/次，非免费，支持 MCP
        base_url: ""
        api_key: ""
        vendor: tianapi
    - name: jisuapi
      enabled: false     # 条件可用（付费）：免费清单不含工商类，默认关闭，仅留 Key 位
      tier: 2
      paid: true
      requires_key: true
      class: providers.biz_commercial.CommercialApiProvider
      params:
        base_url: ""
        api_key: ""
        vendor: jisuapi
    - name: juhe_ent
      enabled: false     # 条件可用（付费）：默认关闭，仅留 Key 位
      tier: 2
      paid: true
      requires_key: true
      class: providers.biz_juhe.JuheEnterpriseProvider
      params:
        # 聚合数据 juhe.cn《企业工商信息基础版》(ID 515)：注册实名后申请，首次送 5 次
        # 数据源为国家公示网；api_key 留空自动跳过该源
        api_key: ""
    - name: commercial_api
      enabled: false     # 条件可用（付费）：本轮不接付费商业 API，仅留 Key 位
      tier: 2
      paid: true
      requires_key: true
      class: providers.biz_commercial.CommercialApiProvider
      params:
        base_url: ""     # 留空使用适配器内置默认地址（天眼查开放平台）
        # 天眼查个人 Key（TOKEN）：鉴权有效但个人账号接口未开通（300005），
        # 运行报错由 fallback 自动跳过；去天眼查开放平台申请权限后自动生效
        api_key: "c3b3bfcb-9759-46af-8752-a21d220e71f6"
        vendor: tianyancha
  lawsuit:
    - name: wenshu
      enabled: true
      tier: 3            # 尽力而为：裁判文书网反爬强
      class: providers.court_wenshu.WenshuProvider
      params: {}
    # 人民法院公告网（最高法主办）——涉诉/执行公告的**可靠源**：
    #   纯 HTTP 打接口恒定 iTotalRecords=0（服务端按来源过滤），URL 的 searchContent
    #   参数也被忽略，必须走「真实渲染 + 页面内点搜索按钮」，已实测可拿到真实公告。
    #   走 Obscura 轻量无头引擎（config 的 browser 段），无需用户手动开浏览器。
    #   同时产出 enforcement（执行文书、拍卖）事件，故只在 lawsuit 下登记一次，避免重复采集。
    - name: rmfygg
      enabled: true
      tier: 1            # 确定可用：官方公开源 + 已验证渲染通路
      class: providers.court_rmfygg.RmfyggProvider
      params:
        settle_ms: 3000          # 搜索后等待异步回填毫秒
        timeout_seconds: 30      # 单次页面会话超时（首次启动引擎会慢一点）
    # Tavily 涉诉检索：默认关闭（实测法院域定向检索拿不到结果，见 biz_change 段的实测结论）。
    #   涉诉请走 rmfygg（tier 1、免 Key、无限次）；需要时把下面 enabled 改 true 试。
    - name: tavily
      enabled: false
      tier: 2
      requires_key: true
      class: providers.tavily_search.TavilyProvider
      params:
        api_key: "${TAVILY_API_KEY}"
        event_category: lawsuit
        query: '"{name}" 裁判文书'
        search_depth: advanced
        max_results: 5
        include_domains:
          - wenshu.court.gov.cn
          - chinacourt.org
          - court.gov.cn
    - name: commercial_api
      enabled: false
      tier: 2
      paid: true
      requires_key: true
      class: providers.biz_commercial.CommercialApiProvider
      params:
        base_url: ""      # 留空使用适配器内置默认地址（天眼查开放平台）
        api_key: "c3b3bfcb-9759-46af-8752-a21d220e71f6"   # 天眼查 TOKEN（个人账号接口未开通 300005，报错自动 fallback）
        secret_key: ""    # 企查查=SecretKey（账号安全页获取）
        vendor: tianyancha
  enforcement:
    - name: zxgk
      enabled: true
      tier: 3            # 尽力而为：执行信息公开网有验证码
      class: providers.court_zxgk.ZxgkProvider
      params: {}
    # 人民法院公告网的「执行文书、拍卖」公告 → 被执行/处置线索（可靠源，tier 1）。
    # 与 lawsuit 下同一适配器共用一次页面搜索结果（适配器内置短时记忆），不会重复开页面。
    - name: rmfygg
      enabled: true
      tier: 1
      class: providers.court_rmfygg.RmfyggProvider
      params:
        settle_ms: 3000
        timeout_seconds: 30
    # Tavily 被执行检索：默认关闭（同涉诉，实测法院域定向检索无结果）。被执行走 rmfygg。
    - name: tavily
      enabled: false
      tier: 2
      requires_key: true
      class: providers.tavily_search.TavilyProvider
      params:
        api_key: "${TAVILY_API_KEY}"
        event_category: enforcement
        query: '"{name}" 被执行人'
        search_depth: advanced
        max_results: 5
        include_domains:
          - zxgk.court.gov.cn
          - creditchina.gov.cn
          - court.gov.cn
    - name: credit_china
      enabled: true      # 本轮新增（R2）：行政处罚/失信/重大税收违法失信
      tier: 3            # 尽力而为：公开政务源，端点运行时核实
                         # 实测 2026-10：加速乐 WAF 对裸 HTTP 统一返回 412（JS 挑战），
                         # 走浏览器渲染后端正文也为空 —— 当前无法稳定取数，错误信息会
                         # 明确提示改用连接器代查，不虚报可用
      class: providers.credit_china.CreditChinaProvider
      params:
        endpoint: "https://public.creditchina.gov.cn/private-api/catalogSearchHome"
    - name: commercial_api
      enabled: false
      tier: 2
      paid: true
      requires_key: true
      class: providers.biz_commercial.CommercialApiProvider
      params:
        base_url: ""      # 留空使用适配器内置默认地址（天眼查开放平台）
        api_key: "c3b3bfcb-9759-46af-8752-a21d220e71f6"   # 天眼查 TOKEN（个人账号接口未开通 300005，报错自动 fallback）
        secret_key: ""    # 企查查=SecretKey（账号安全页获取）
        vendor: tianyancha
  social:
    # 社媒源统一策略（spec §ADDED 需求1/2）：
    #   requires_auth=true  →  未配置登录态时**跳过且不发请求**（按需访问）
    #   登录态来源优先级：params.cookie（此处） > social_auth.yaml（设置中心写入）
    #   settle_ms           →  浏览器渲染后的额外等待毫秒（结果异步回填，越大越慢越全）
    - name: weibo
      enabled: true
      tier: 3
      requires_auth: true
      class: providers.social_weibo.WeiboProvider
      params:
        cookie: ""     # 登录态 Cookie，留空则读 social_auth.yaml
        settle_ms: 2500
    - name: wechat_sogou
      enabled: true
      tier: 3
      class: providers.social_wechat.SogouWeixinProvider
      params:
        cookie: ""
    - name: douyin
      enabled: true
      tier: 3
      requires_auth: true
      class: providers.social_douyin.DouyinProvider
      params:
        cookie: ""
        settle_ms: 4000
    - name: kuaishou
      enabled: true
      tier: 3
      requires_auth: true
      class: providers.social_kuaishou.KuaishouProvider
      params:
        cookie: ""
        settle_ms: 4000
    - name: xiaohongshu
      enabled: true
      tier: 3
      requires_auth: true
      class: providers.social_xiaohongshu.XiaohongshuProvider
      params:
        cookie: ""
        settle_ms: 4000
    # OpenCLI 后端：通过本地 opencli CLI 复用**已登录的 Chrome** 做跨平台采集。
    #   复用浏览器登录态，绕开各平台风控；与上面的自研 CDP 方案并存互备。
    #   前置条件：① npm install -g @jackwener/opencli
    #             ② Chrome 安装 Browser Bridge 扩展（tools/opencli_ext 目录，
    #               chrome://extensions → 开发者模式 → 加载已解压的扩展程序）
    #             ③ 在该 Chrome 里用小号登录目标平台
    #   未满足前置时该源会被跳过，不影响其它社媒源。默认关闭，需显式启用。
    - name: opencli
      enabled: false
      tier: 2
      class: providers.opencli_base.OpenCliProvider
      params:
        platforms:          # 覆盖平台清单（可按需增删）
          - weibo
          - xiaohongshu
          - weixin
          - zhihu
          - tieba
          - hupu
          - bilibili
          - jike
          - 36kr
          - linux-do
          - douyin
        limit: 10
        timeout_seconds: 90
        cli_path: ""        # 留空则从 PATH 查找 opencli

network:
  timeout_seconds: 15
  max_per_host_rps: 1        # 限流：每主机每秒最大请求数
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36

# 渲染后端：公开站点（法院公告网等）默认走 Obscura 轻量无头引擎，
# 不再需要用户手动开 Chrome；需登录的社媒仍走 Chrome（无头引擎无法扫码登录）。
#   backend=auto      优先 Obscura，缺失/启动失败才回退已运行的 Chrome（推荐）
#   backend=obscura   只用 Obscura（缺失直接报错，便于排查）
#   backend=chrome    只用 Chrome/Edge（沿用旧行为）
browser:
  backend: auto
  obscura_path: ""            # 留空自动查找 tools/obscura/obscura.exe，或 PATH 中的 obscura
  obscura_port: 9223          # 与 Chrome 的 9222 分开，两个后端可同时运行
  obscura_stealth: true       # 开启反检测（指纹一致 + TLS 伪装），公开站点更稳
  chrome_port: 9222
  settle_ms: 3000             # 页面渲染后额外等待毫秒（异步接口回填）

ui:
  map_mode: severity   # severity=按严重度着色 / category=按信息类型着色
